<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metronome & Tuner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tab-button {
            flex: 1;
            padding: 15px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-button.active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }

        .tab-content {
            display: none;
            background: rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .tab-content.active {
            display: block;
        }

        /* Metronome Styles */
        .bpm-display {
            text-align: center;
            font-size: 4em;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .bpm-control {
            width: 100%;
            margin-bottom: 30px;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            outline: none;
        }

        .metronome-controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .control-button {
            padding: 20px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .start-button {
            background: #4CAF50;
            color: white;
        }

        .stop-button {
            background: #f44336;
            color: white;
        }

        .control-button:active {
            transform: scale(0.95);
        }

        .beat-indicator {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            margin: 30px auto;
            transition: all 0.1s;
        }

        .beat-indicator.active {
            background: #fff;
            transform: scale(1.2);
        }

        /* Tuner Styles */
        .tuner-display {
            text-align: center;
            margin-bottom: 30px;
        }

        .note-display {
            font-size: 5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .frequency-display {
            font-size: 1.5em;
            opacity: 0.8;
        }

        .cents-meter {
            width: 100%;
            height: 60px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            margin: 30px 0;
            position: relative;
            overflow: hidden;
        }

        .cents-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 100%;
            background: #fff;
            transform: translate(-50%, -50%);
            transition: left 0.1s;
        }

        .cents-marker {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            background: rgba(255, 255, 255, 0.5);
            transform: translateX(-50%);
        }

        .tuner-controls {
            text-align: center;
        }

        .status-message {
            text-align: center;
            font-size: 1.2em;
            margin-top: 20px;
            min-height: 30px;
        }

        .playback-controls {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid rgba(255, 255, 255, 0.3);
        }

        .small-button {
            padding: 10px 20px;
            font-size: 1em;
            margin: 5px;
        }

        .log-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid rgba(255, 255, 255, 0.3);
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .log-title {
            font-size: 1.3em;
            font-weight: bold;
        }

        .log-display {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .log-entry {
            margin-bottom: 5px;
        }

        .log-stats {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-family: monospace;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Metronome & Tuner</h1>

        <div class="tabs">
            <button class="tab-button active" data-tab="metronome">Metronome</button>
            <button class="tab-button" data-tab="tuner">Tuner</button>
        </div>

        <!-- Metronome Tab -->
        <div class="tab-content active" id="metronome">
            <div class="bpm-display" id="bpmDisplay">120</div>
            <div class="bpm-control">
                <input type="range" id="bpmSlider" min="40" max="240" value="120">
            </div>
            <div class="beat-indicator" id="beatIndicator"></div>
            <div class="metronome-controls">
                <button class="control-button start-button" id="startButton">Start</button>
                <button class="control-button stop-button" id="stopButton">Stop</button>
            </div>
        </div>

        <!-- Tuner Tab -->
        <div class="tab-content" id="tuner">
            <div class="tuner-display">
                <div class="note-display" id="noteDisplay">-</div>
                <div class="frequency-display" id="frequencyDisplay">--- Hz</div>
            </div>
            <div class="cents-meter">
                <div class="cents-marker"></div>
                <div class="cents-indicator" id="centsIndicator"></div>
            </div>
            <div class="tuner-controls">
                <button class="control-button start-button" id="startTuner">Start Tuner</button>
                <button class="control-button stop-button" id="stopTuner">Stop Tuner</button>
            </div>
            <div class="status-message" id="statusMessage"></div>

            <!-- Playback Controls -->
            <div class="playback-controls">
                <button class="control-button small-button start-button" id="playbackButton">Play Last 5s</button>
            </div>

            <!-- Log Section -->
            <div class="log-section">
                <div class="log-header">
                    <div class="log-title">Detection Log</div>
                    <div>
                        <button class="control-button small-button start-button" id="clearLog">Clear</button>
                        <button class="control-button small-button start-button" id="exportStats">Export JSON</button>
                    </div>
                </div>
                <div class="log-display" id="logDisplay"></div>
                <div class="log-stats" id="logStats"></div>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
